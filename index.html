<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PEI Golf Trip Countdown</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,.14), transparent 28%),
      linear-gradient(145deg, #0b3d2e, #09271f 55%, #071914);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow: hidden;
  }
  .card {
    width: min(900px, 100%);
    text-align: center;
    padding: 48px 24px;
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 28px;
    background: rgba(0,0,0,.20);
    backdrop-filter: blur(12px);
    box-shadow: 0 24px 80px rgba(0,0,0,.35);
  }
  .eyebrow {
    font-size: 14px;
    letter-spacing: .22em;
    text-transform: uppercase;
    opacity: .75;
    margin-bottom: 12px;
  }
  h1 {
    margin: 0;
    font-size: clamp(42px, 9vw, 86px);
    line-height: .95;
    letter-spacing: -.045em;
  }
  .subtitle {
    margin: 18px 0 38px;
    font-size: clamp(18px, 3vw, 26px);
    opacity: .9;
  }
  .countdown {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    max-width: 760px;
    margin: 0 auto 34px;
  }
  .unit {
    background: rgba(255,255,255,.09);
    border-radius: 18px;
    padding: 18px 8px 14px;
  }
  .number {
    font-size: clamp(34px, 8vw, 70px);
    font-weight: 800;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .label {
    margin-top: 8px;
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    opacity: .65;
  }
  .flight {
    font-size: 17px;
    margin-bottom: 28px;
    opacity: .9;
  }
  .tagline {
    font-size: clamp(18px, 3vw, 28px);
    font-weight: 700;
    letter-spacing: .02em;
  }
  .details {
    margin-top: 14px;
    font-size: 13px;
    opacity: .55;
  }
  @media (max-width: 520px) {
    .card { padding: 38px 14px; border-radius: 22px; }
    .countdown { gap: 6px; }
    .unit { padding: 15px 4px 12px; border-radius: 14px; }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">⛳ Golf Trip Countdown</div>
    <h1>PEI</h1>
    <div class="subtitle">The boys are heading east.</div>

    <section class="countdown" aria-label="Countdown">
      <div class="unit"><div class="number" id="days">--</div><div class="label">Days</div></div>
      <div class="unit"><div class="number" id="hours">--</div><div class="label">Hours</div></div>
      <div class="unit"><div class="number" id="minutes">--</div><div class="label">Minutes</div></div>
      <div class="unit"><div class="number" id="seconds">--</div><div class="label">Seconds</div></div>
    </section>

    <div class="flight">✈️ Toronto → PEI &nbsp;•&nbsp; September 18, 2026 &nbsp;•&nbsp; 8:25 AM</div>
    <div class="tagline" id="message">Golf. Drinks. Questionable decisions.</div>
    <div class="details">Countdown ends at wheels-up.</div>
  </main>

<script>
  // September 18, 2026 at 8:25 AM Eastern Time.
  // The time is written with the Eastern Daylight Time offset for September.
  const target = new Date("2026-09-18T08:25:00-04:00").getTime();

  function update() {
    const now = Date.now();
    let diff = target - now;

    if (diff <= 0) {
      document.getElementById("days").textContent = "0";
      document.getElementById("hours").textContent = "0";
      document.getElementById("minutes").textContent = "0";
      document.getElementById("seconds").textContent = "0";
      document.getElementById("message").textContent = "🍻 LET'S FUCKING GO.";
      return;
    }

    const totalSeconds = Math.floor(diff / 1000);
    const days = Math.floor(totalSeconds / 86400);
    const hours = Math.floor((totalSeconds % 86400) / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    document.getElementById("days").textContent = days;
    document.getElementById("hours").textContent = String(hours).padStart(2, "0");
    document.getElementById("minutes").textContent = String(minutes).padStart(2, "0");
    document.getElementById("seconds").textContent = String(seconds).padStart(2, "0");
  }

  update();
  setInterval(update, 1000);
</script>
</body>
</html>
